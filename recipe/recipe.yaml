schema_version: 1

context:
  version: "1.3.0"

package:
  name: dqsegdb2
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dqsegdb2/dqsegdb2-${{ version }}.tar.gz
  sha256: 4e291899cd395daf5913c48a835d213ef20833d78354871cb848988cc2cc8ae4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - dqsegdb2 = dqsegdb2.cli:cli

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=69.3.0
    - setuptools-scm >=3.4.3
  run:
    - click >=6.7
    - igwn-auth-utils >=1.0.0
    - igwn-segments >=2.0.0
    - python >=${{ python_min }}

tests:
  - requirements:
      run:
        - pip
        - pytest >=2.9.2
        - python ${{ python_min }}.*
        - requests-mock >=1.5.0
    script:
      - python -m pip check
      - python -m pip show dqsegdb2
      - python -m pytest --pyargs -ra -v dqsegdb2.tests
      - dqsegdb2 --help
      - dqsegdb2 query --help

about:
  summary: A simplified Python implementation of the DQSegDB API
  description: |
    This package only provides a query interface for `GET` requests for a
    subset of information available from a DQSegDB server.
    Any users wishing to make `POST` requests should refer to the official
    DQSegDB Python client available from https://pypi.org/project/dqsegdb.
  homepage: https://dqsegdb2.readthedocs.io
  repository: https://git.ligo.org/computing/software/dqsegdb2.git
  documentation: https://dqsegdb2.readthedocs.io
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - duncanmmacleod
